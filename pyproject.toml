[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-deepinfer"
version = "0.1.0"
description = "A small CPU-first inference engine inspired by DeepInfer"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2", "transformers>=4.46,<5",
    "safetensors>=0.4", "huggingface-hub>=0.26",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["nano_deepinfer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
