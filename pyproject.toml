[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-deepinfer"
version = "0.1.0"
description = "A small CPU-first inference engine inspired by DeepInfer"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
hf = ["transformers>=4.46,<5", "safetensors>=0.4", "huggingface-hub>=0.26"]
test = ["pytest>=8"]

[project.scripts]
nano-deepinfer = "nano_deepinfer.__main__:main"

[tool.setuptools.packages.find]
include = ["nano_deepinfer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
